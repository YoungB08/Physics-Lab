version: '3.9'
services:
  mysql:
    image: mysql:8.4
    container_name: vatly_thpt_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: vatly_thpt
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:
